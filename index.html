<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Medicinali</title>
    <style>
        :root {
            --primary-color: #007aff;
            --danger-color: #ff3b30;
            --warning-color: #ff9500;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 50px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 8px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active {
            opacity: 0.8;
        }
        .med-item {
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            border-left: 6px solid var(--primary-color);
        }
        .med-item.low-stock {
            border-left-color: var(--danger-color);
            background-color: #fff5f5;
        }
        .med-item.warning-stock {
            border-left-color: var(--warning-color);
            background-color: #fffdf0;
        }
        .med-info h3 {
            margin: 0 0 4px 0;
            font-size: 18px;
        }
        .med-info p {
            margin: 2px 0;
            font-size: 14px;
            color: #666;
        }
        .med-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .med-actions button {
            width: auto;
            padding: 6px 10px;
            margin: 0;
            font-size: 13px;
        }
        .btn-row {
            display: flex;
            gap: 4px;
        }
        .btn-delete {
            background-color: var(--danger-color);
        }
        .btn-edit {
            background-color: #5856d6;
        }
        .alert-badge {
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
            margin-top: 4px;
        }
        .badge-danger { color: var(--danger-color); }
        .badge-warning { color: var(--warning-color); }
    </style>
</head>
<body>

<div class="container">
    <h1>💊 I Miei Medicinali</h1>

    <!-- Form Aggiunta / Modifica -->
    <div class="card">
        <h3 id="formTitle">Aggiungi Medicinale</h3>
        <input type="hidden" id="editIndex" value="-1">
        
        <label>Nome Medicinale</label>
        <input type="text" id="medName" placeholder="es. Tachipirina">
        
        <label>Quantità attuale (scorte)</label>
        <input type="number" step="any" id="medQty" placeholder="es. 20">
        
        <label>Consumo giornaliero (es. 2 o 2.5)</label>
        <input type="number" step="any" id="medDaily" placeholder="es. 2.5">
        
        <label>Soglia minima di avviso (scorte in pezzi)</label>
        <input type="number" step="any" id="medMin" placeholder="es. 5">
        
        <button id="saveBtn" onclick="saveMedication()">Salva Medicinale</button>
        <button id="cancelBtn" onclick="resetForm()" style="background-color: #8e8e93; display: none;">Annulla</button>
    </div>

    <!-- Lista Medicinali -->
    <div id="medList"></div>
</div>

<script>
    let medications = JSON.parse(localStorage.getItem('medications')) || [];

    function saveAndRender() {
        localStorage.setItem('medications', JSON.stringify(medications));
        renderMedications();
    }

    function saveMedication() {
        const index = parseInt(document.getElementById('editIndex').value);
        const name = document.getElementById('medName').value.trim();
        const qty = parseFloat(document.getElementById('medQty').value);
        const daily = parseFloat(document.getElementById('medDaily').value);
        const min = parseFloat(document.getElementById('medMin').value);

        if (!name || isNaN(qty) || isNaN(daily) || isNaN(min) || daily <= 0) {
            alert("Per favore compila tutti i campi correttamente (il consumo giornaliero deve essere maggiore di 0).");
            return;
        }

        if (index === -1) {
            // Aggiunta nuovo
            medications.push({ id: Date.now(), name, qty, daily, min });
        } else {
            // Modifica esistente
            medications[index].name = name;
            medications[index].qty = qty;
            medications[index].daily = daily;
            medications[index].min = min;
        }
        
        resetForm();
        saveAndRender();
    }

    function editMedication(index) {
        const med = medications[index];
        document.getElementById('medName').value = med.name;
        document.getElementById('medQty').value = med.qty;
        document.getElementById('medDaily').value = med.daily;
        document.getElementById('medMin').value = med.min;
        document.getElementById('editIndex').value = index;
        
        document.getElementById('formTitle').innerText = "Modifica Medicinale";
        document.getElementById('saveBtn').innerText = "Aggiorna Medicinale";
        document.getElementById('cancelBtn').style.display = "block";
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('medName').value = '';
        document.getElementById('medQty').value = '';
        document.getElementById('medDaily').value = '';
        document.getElementById('medMin').value = '';
        document.getElementById('editIndex').value = '-1';
        
        document.getElementById('formTitle').innerText = "Aggiungi Medicinale";
        document.getElementById('saveBtn').innerText = "Salva Medicinale";
        document.getElementById('cancelBtn').style.display = "none";
    }

    function updateQty(id, amount) {
        const med = medications.find(m => m.id === id);
        if (med) {
            med.qty = parseFloat((med.qty + amount).toFixed(2));
            if (med.qty < 0) med.qty = 0;
            saveAndRender();
        }
    }

    function deleteMed(id) {
        if (confirm("Vuoi davvero eliminare questo medicinale?")) {
            medications = medications.filter(m => m.id !== id);
            resetForm();
            saveAndRender();
        }
    }

    function renderMedications() {
        const listContainer = document.getElementById('medList');
        listContainer.innerHTML = '';

        if (medications.length === 0) {
            listContainer.innerHTML = '<p style="text-align: center; color: #888;">Nessun medicinale inserito.</p>';
            return;
        }

        medications.forEach((med, index) => {
            const daysLeft = (med.qty / med.daily).toFixed(1);
            const daysLeftInt = Math.ceil(med.qty / med.daily);
            
            let statusClass = '';
            let alertHtml = '';

            if (med.qty === 0) {
                statusClass = 'low-stock';
                alertHtml = `<br><span class="alert-badge badge-danger">🚨 SCORTE ESAURITE!</span>`;
            } else if (med.qty <= med.min || daysLeftInt <= 3) {
                statusClass = 'low-stock';
                alertHtml = `<br><span class="alert-badge badge-danger">⚠️ ATTENZIONE: Rimangono circa ${daysLeft} giorni di autonomia!</span>`;
            } else if (daysLeftInt <= 7) {
                statusClass = 'warning-stock';
                alertHtml = `<br><span class="alert-badge badge-warning">⚡ Attenzione: Scorte per circa ${daysLeft} giorni.</span>`;
            }

            const itemDiv = document.createElement('div');
            itemDiv.className = `med-item ${statusClass}`;
            
            itemDiv.innerHTML = `
                <div class="med-info">
                    <h3>${med.name}</h3>
                    <p>Scorte: <strong>${med.qty}</strong> | Consumo: ${med.daily}/giorno</p>
                    <p>Autonomia stimata: <strong>${daysLeft} giorni</strong></p>
                    ${alertHtml}
                </div>
                <div class="med-actions">
                    <div class="btn-row">
                        <button onclick="updateQty(${med.id}, -${med.daily})" title="Scala consumo giornaliero">-${med.daily}</button>
                        <button onclick="updateQty(${med.id}, ${med.daily})" title="Aggiungi consumo giornaliero">+${med.daily}</button>
                    </div>
                    <div class="btn-row">
                        <button class="btn-edit" onclick="editMedication(${index})">Modifica</button>
                        <button class="btn-delete" onclick="deleteMed(${med.id})">Elimina</button>
                    </div>
                </div>
            `;
            listContainer.appendChild(itemDiv);
        });
    }

    // Carica la lista all'avvio
    renderMedications();
</script>

</body>
</html>
